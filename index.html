<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prediabetes Tracker & Planner</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0ea5e9">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./config.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-12">

  <!-- App Header -->
  <header class="bg-sky-600 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-md mx-auto px-4 py-4 flex flex-col gap-2">
      <div class="flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
          🩺 Prediabetes Tracker
        </h1>
        <span class="text-[11px] bg-sky-700 px-2 py-0.5 rounded-full font-medium">Research Mode</span>
      </div>
      
      <!-- Submit Button Banner -->
      <div class="bg-sky-700/50 rounded-xl p-3 flex flex-col gap-2 text-xs">
        <div class="flex justify-between items-center">
          <span class="text-sky-100 font-medium">📋 Academic Registry Sync:</span>
          <span id="syncStatus" class="text-[10px] bg-sky-800 px-2 py-0.5 rounded text-sky-300 font-bold">Ready</span>
        </div>
        <p class="text-[11px] text-sky-200">Fill the form below and click submit to save your data instantly.</p>
        <button id="autoSubmitBtn" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-2 rounded-lg transition text-center cursor-pointer">
          ✅ Submit to Research Database
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- Section 1: Official CDC Screening Calculator -->
    <section class="bg-white rounded-2xl p-5 shadow-xs border border-slate-100">
      <div class="flex items-center gap-2 mb-1">
        <span class="bg-sky-100 text-sky-800 text-[10px] font-bold uppercase px-2 py-0.5 rounded">Official Standard</span>
        <h2 class="text-lg font-semibold text-slate-900">CDC Risk Assessment</h2>
      </div>
      <p class="text-xs text-slate-500 mb-4">Complete all choices to determine your risk score.</p>
      
      <form id="cdcRiskForm" class="space-y-4">
        <!-- Age -->
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1">1. How old are you?</label>
          <select id="cdcAge" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-sky-500">
            <option value="0">Younger than 40 years (0 points)</option>
            <option value="1">40–49 years (1 point)</option>
            <option value="2">50–59 years (2 points)</option>
            <option value="3">60 years or older (3 points)</option>
          </select>
        </div>

        <!-- Sex & Gestational -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">2. Biological Sex</label>
            <select id="cdcSex" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-sky-500">
              <option value="1">Male (1 point)</option>
              <option value="0">Female (0 points)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">3. Gestational Diabetes</label>
            <select id="cdcGestational" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-sky-500">
              <option value="0">No (0 points)</option>
              <option value="1">Yes (1 point)</option>
            </select>
          </div>
        </div>

        <!-- Family History & High BP -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">4. Family History</label>
            <select id="cdcFamily" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-sky-500">
              <option value="0">No (0 points)</option>
              <option value="1">Yes - Sibling/Parent (1 pt)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">5. High Blood Pressure</label>
            <select id="cdcHbp" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-sky-500">
              <option value="0">No (0 points)</option>
              <option value="1">Yes (1 point)</option>
            </select>
          </div>
        </div>

        <!-- Physical Activity & Weight Status Grid -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">6. Physically Active?</label>
            <select id="cdcActive" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-sky-500">
              <option value="0">Yes (0 points)</option>
              <option value="1">No / Inactive (1 point)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">7. Weight Profile</label>
            <select id="cdcWeightStatus" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-sky-500">
              <option value="0">Normal Weight (0 points)</option>
              <option value="1">Overweight (1 point)</option>
              <option value="2">Obese (2 points)</option>
              <option value="3">Severely Obese (3 points)</option>
            </select>
          </div>
        </div>

        <button type="button" onclick="calculateCDCRisk()" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-sm cursor-pointer">
          Compute CDC Risk Score
        </button>
      </form>

      <div id="cdcRiskResult" class="mt-4 p-4 rounded-xl hidden transition-all duration-300"></div>
    </section>

    <!-- Section 2: Daily Biometric Log -->
    <section class="bg-white rounded-2xl p-5 shadow-xs border border-slate-100">
      <h2 class="text-lg font-semibold text-slate-900 mb-3">📊 Daily Biometric Log</h2>
      
      <form id="logForm" class="space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Fasting Glucose (mg/dL)</label>
            <input type="number" id="glucose" placeholder="e.g. 104" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-sky-500" required>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Weight (lbs)</label>
            <input type="number" id="weight" placeholder="e.g. 165" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-sky-500" required>
          </div>
        </div>
      </form>
    </section>

  </main>

  <!-- JavaScript Functions -->
  <script>
    // Function to save data to GitHub
    async function saveToGitHub(newData) {
      try {
        console.log('📤 Saving to GitHub...');
        
        // Step 1: Get current file from GitHub
        const getUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
        const getResponse = await fetch(getUrl, {
          headers: {
            'Authorization': `token ${GITHUB_TOKEN}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!getResponse.ok) {
          throw new Error(`Failed to fetch file: ${getResponse.statusText}`);
        }

        const fileData = await getResponse.json();
        const currentSHA = fileData.sha;

        // Step 2: Read current content
        const currentContent = JSON.parse(
          atob(fileData.content)
        );

        // Step 3: Add new data
        currentContent.participants.push(newData);

        // Step 4: Upload back to GitHub
        const putUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
        const putResponse = await fetch(putUrl, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${GITHUB_TOKEN}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Add risk assessment - Participant ${currentContent.participants.length}`,
            content: btoa(JSON.stringify(currentContent, null, 2)),
            sha: currentSHA
          })
        });

        if (!putResponse.ok) {
          throw new Error(`Failed to save: ${putResponse.statusText}`);
        }

        console.log('✅ Data saved to GitHub successfully!');
        alert('✅ Your assessment has been saved to research database!');
        
        // Reset form
        document.getElementById('cdcAge').value = '0';
        document.getElementById('cdcSex').value = '1';
        document.getElementById('cdcGestational').value = '0';
        document.getElementById('cdcFamily').value = '0';
        document.getElementById('cdcHbp').value = '0';
        document.getElementById('cdcActive').value = '0';
        document.getElementById('cdcWeightStatus').value = '0';
        document.getElementById('glucose').value = '';
        document.getElementById('weight').value = '';
        document.getElementById('cdcRiskResult').classList.add('hidden');
        
        return true;

      } catch (error) {
        console.error('❌ Error:', error);
        alert('❌ Error saving data: ' + error.message);
        return false;
      }
    }

    // Main submit function
    function submitAssessment() {
      // Get CDC risk score
      const age = parseInt(document.getElementById('cdcAge').value);
      const sex = parseInt(document.getElementById('cdcSex').value);
      const gestational = parseInt(document.getElementById('cdcGestational').value);
      const family = parseInt(document.getElementById('cdcFamily').value);
      const hbp = parseInt(document.getElementById('cdcHbp').value);
      const active = parseInt(document.getElementById('cdcActive').value);
      const weight = parseInt(document.getElementById('cdcWeightStatus').value);

      const total = age + sex + gestational + family + hbp + active + weight;

      // Determine risk level
      let riskLevel = 'low';
      if (total >= 5) riskLevel = 'moderate';
      if (total >= 9) riskLevel = 'high';

      // Get biometrics
      const glucose = document.getElementById('glucose').value;
      const weightLbs = document.getElementById('weight').value;

      if (!glucose || !weightLbs) {
        alert('❌ Please fill in all biometric data before submitting');
        return;
      }

      // Create data object
      const newParticipant = {
        userId: `user_${Date.now()}`,
        name: `Participant ${Date.now()}`,
        riskAssessments: [{
          timestamp: new Date().toISOString(),
          cdcRiskScore: total,
          riskLevel: riskLevel,
          cdcFactors: {
            "Age (0-3 points)": age,
            "Biological Sex (0-1 point)": sex,
            "Gestational Diabetes (0-1 point)": gestational,
            "Family History (0-1 point)": family,
            "High Blood Pressure (0-1 point)": hbp,
            "Physical Activity (0-1 point)": active,
            "Weight Profile (0-3 points)": weight
          }
        }],
        dailyBiometricLog: [{
          timestamp: new Date().toISOString(),
          "Fasting Glucose (mg/dL)": parseInt(glucose),
          "Weight (lbs)": parseInt(weightLbs)
        }]
      };

      // Save to GitHub
      saveToGitHub(newParticipant);
    }

    // Calculate CDC Risk
    function calculateCDCRisk() {
      const age = parseInt(document.getElementById('cdcAge').value);
      const sex = parseInt(document.getElementById('cdcSex').value);
      const gestational = parseInt(document.getElementById('cdcGestational').value);
      const family = parseInt(document.getElementById('cdcFamily').value);
      const hbp = parseInt(document.getElementById('cdcHbp').value);
      const active = parseInt(document.getElementById('cdcActive').value);
      const weight = parseInt(document.getElementById('cdcWeightStatus').value);

      const total = age + sex + gestational + family + hbp + active + weight;

      let riskLevel = 'LOW RISK';
      let color = 'bg-green-100 text-green-800';
      if (total >= 5) {
        riskLevel = 'MODERATE RISK';
        color = 'bg-yellow-100 text-yellow-800';
      }
      if (total >= 9) {
        riskLevel = 'HIGH RISK';
        color = 'bg-red-100 text-red-800';
      }

      const resultDiv = document.getElementById('cdcRiskResult');
      resultDiv.innerHTML = `
        <div class="${color} p-4 rounded-lg">
          <p class="font-bold text-lg">Your CDC Risk Score: <span class="text-2xl">${total}/9</span></p>
          <p class="mt-2">Risk Level: <strong>${riskLevel}</strong></p>
        </div>
      `;
      resultDiv.classList.remove('hidden');
    }

    // Attach click handler to submit button
    document.addEventListener('DOMContentLoaded', function() {
      const submitBtn = document.getElementById('autoSubmitBtn');
      if (submitBtn) {
        submitBtn.onclick = function(e) {
          e.preventDefault();
          submitAssessment();
        };
      }
    });
  </script>

</body>
</html>
